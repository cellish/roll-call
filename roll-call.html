<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="指名帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>指名帳</title>
<style>
/* Layout: one narrow column (roll-book page) with a sticky header + tabs; the calling stage is the centre of the page. */
:root{
  --paper:#f2f4f1; --surface:#ffffff; --sunk:#e8ebe6;
  --ink:#1b2231; --muted:#5d6574; --line:#d6dad2;
  --accent:#2b3d8c; --accent-ink:#ffffff; --accent-soft:#e3e7f6;
  --seal:#c23e27; --seal-soft:#f8e5e0;
  --absent:#8a5800; --absent-soft:#f6ecd9;
  --late:#1f6b5c; --late-soft:#dcefe9;
  --f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --f-name:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --r:10px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12151b; --surface:#1b1f27; --sunk:#232834;
  --ink:#e7e9ef; --muted:#9aa1af; --line:#2e3441;
  --accent:#93a5f2; --accent-ink:#10152b; --accent-soft:#252c47;
  --seal:#ef7b63; --seal-soft:#3a2420;
  --absent:#e2b45a; --absent-soft:#352a17;
  --late:#6fd0b8; --late-soft:#17332d;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#12151b; --surface:#1b1f27; --sunk:#232834;
  --ink:#e7e9ef; --muted:#9aa1af; --line:#2e3441;
  --accent:#93a5f2; --accent-ink:#10152b; --accent-soft:#252c47;
  --seal:#ef7b63; --seal-soft:#3a2420;
  --absent:#e2b45a; --absent-soft:#352a17;
  --late:#6fd0b8; --late-soft:#17332d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-ui);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.top h1{margin:0;font:600 1.25rem/1 var(--f-name);letter-spacing:.12em}
.course-pick{margin-left:auto;min-width:0;flex:0 1 320px}
.course-pick select{width:100%}
.tabs{display:flex;gap:4px;padding-block:0}
.tabs button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--f-ui);padding:10px 4px 9px;border-bottom:3px solid transparent;cursor:pointer;letter-spacing:.08em}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:20px 48px}
.sbar{background:var(--absent-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.sbar-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px;font-size:.9rem}
.sbar-in span{flex:1 1 240px}
.banner{background:var(--seal-soft);color:var(--seal);padding:10px 16px;font-size:.9rem;text-align:center}

/* controls */
select,input[type=text],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;resize:vertical}
input[type=text],input[type=password]{width:100%}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;cursor:pointer;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.btn.danger.armed{background:var(--seal);color:var(--surface)}
.btn.small{min-height:34px;padding:5px 12px;font-size:.85rem}
.btn.big{font-size:1.35rem;padding:18px 48px;min-height:68px;border-radius:14px;letter-spacing:.15em}
.link{appearance:none;background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:8px}
kbd{font:500 .72rem ui-monospace,Menlo,monospace;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.stack{display:grid;gap:16px}
.card h3{margin:0;font-size:1rem;letter-spacing:.05em}
.card p{margin:0}

/* calling stage */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px 24px;display:grid;justify-items:center;gap:14px;text-align:center}
.eyebrow{margin:0;font-size:.8rem;letter-spacing:.14em;color:var(--muted)}
.poolnum{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.poolnum b{font:600 3rem/1 var(--f-name)}
.sid{margin:0;font:500 1rem ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted);letter-spacing:.08em;min-height:1.4em}
.sid .grade{margin-left:.9em;padding-left:.9em;border-left:1px solid var(--line);font-family:var(--f-ui);letter-spacing:.04em}
.namebox{display:grid;gap:2px;justify-items:center}
.kana{margin:0;font-size:clamp(.95rem,3.4vw,1.25rem);color:var(--muted);letter-spacing:.22em;min-height:1.5em}
.name{margin:0;font:600 clamp(2.4rem,11vw,4.6rem)/1.15 var(--f-name);letter-spacing:.06em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.name.spin{color:var(--muted)}
.name.sm{font-size:clamp(1.7rem,7vw,2.6rem)}
.hist{margin:0;font-size:.85rem;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;width:100%;max-width:560px}
.grades.one{grid-template-columns:1fr}
.grades.one .gl{font-size:1.5rem;letter-spacing:.2em}
.wrapseg{flex-wrap:wrap;display:flex;width:fit-content;max-width:100%}
.gbtn{appearance:none;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:14px;min-height:76px;display:grid;place-items:center;gap:0;cursor:pointer;font-family:var(--f-name);padding:6px}
.gbtn .gl{font-size:1.9rem;line-height:1.1;font-weight:600}
.gbtn .gp{font:500 .75rem var(--f-ui);opacity:.75}
.gbtn:hover{background:var(--accent-soft)}
.gbtn.current{background:var(--accent);color:var(--accent-ink)}
.gbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gbtn:disabled{opacity:.4;cursor:default}
.abtn{appearance:none;border:1.5px solid var(--absent);background:var(--absent-soft);color:var(--absent);border-radius:14px;min-height:52px;width:100%;max-width:560px;font:700 1.05rem var(--f-ui);letter-spacing:.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.abtn.current{background:var(--absent);color:var(--surface)}
.abtn:disabled{opacity:.4}
.memo{width:100%;max-width:560px;text-align:left;display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.editing{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:600}
.notice{background:var(--sunk);border-radius:12px;padding:14px 16px;max-width:520px}

/* seal */
.seal{width:118px;height:118px;border-radius:50%;border:4px solid var(--seal);color:var(--seal);display:grid;place-items:center;font:700 2.6rem/1 var(--f-name);transform:rotate(-8deg);background:var(--seal-soft);animation:stamp .28s ease-out both}
.seal.long{font-size:1.5rem;letter-spacing:.05em}
.seal.absent{border-color:var(--absent);color:var(--absent);background:var(--absent-soft);font-size:1.9rem}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.5);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.seal{animation:none}}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
td.wrap-cell{white-space:normal;min-width:8em}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.05em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-block;min-width:2em;text-align:center;border-radius:999px;padding:1px 8px;font-weight:700;background:var(--accent-soft);color:var(--accent);font-family:var(--f-name)}
.pill.late{background:var(--late-soft);color:var(--late);font-family:var(--f-ui);font-size:.82rem}
.pill.none{background:none;color:var(--muted);font-family:var(--f-ui);font-size:.82rem;font-weight:500}
.pill.absent{background:var(--absent-soft);color:var(--absent);font-family:var(--f-ui);font-size:.82rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 .88rem var(--f-ui);padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,24,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card h3{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.field > *{color:var(--ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.check input{margin-top:5px}
@media (max-width:480px){.btn.big{padding:16px 32px;width:100%}.top h1{font-size:1.1rem}.course-pick{flex-basis:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <h1>指名帳</h1>
    <label class="course-pick"><span class="sr">講義</span><select id="courseSel"></select></label>
  </div>
  <nav class="wrap tabs" role="tablist">
    <button role="tab" data-tab="call">指名</button>
    <button role="tab" data-tab="rec">記録</button>
    <button role="tab" data-tab="roster">名簿</button>
    <button role="tab" data-tab="set">設定</button>
  </nav>
</header>
<div id="storeWarn" class="banner" hidden>このブラウザでは記録を保存できません（プライベートブラウズ中など）。閉じる前に記録をCSVで書き出してください。</div>
<div id="statusBar" class="sbar" hidden></div>
<main class="wrap" id="main"></main>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
const KEY='shimeicho.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const timeStr=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
const WD='日月火水木金土';
const dayLabel=k=>{const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);return `${m}/${d}（${WD[dt.getDay()]}）`};
const today=()=>dayKey(new Date());
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=()=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}catch(e){return Math.random()}};

/* 評価の段階：評価なし・2〜5段階・自由に設定 */
const SCALES={
  none:{name:'評価なし',g:[{label:'済',points:null}]},
  '2':{name:'2段階',g:[{label:'○',points:1},{label:'×',points:0}]},
  '3':{name:'3段階',g:[{label:'○',points:2},{label:'△',points:1},{label:'×',points:0}]},
  '4':{name:'4段階',g:[{label:'◎',points:3},{label:'○',points:2},{label:'△',points:1},{label:'×',points:0}]},
  '5':{name:'5段階',g:[{label:'5',points:5},{label:'4',points:4},{label:'3',points:3},{label:'2',points:2},{label:'1',points:1}]}
};
const PASS={label:'パス',points:null};
const scaleGrades=(k,pass)=>{const g=SCALES[k].g.map(x=>({...x}));if(pass&&k!=='none')g.push({...PASS});return g};
const DEFAULT_GRADES=scaleGrades('4',true);
const sameGrades=(a,b)=>a.length===b.length&&a.every((x,i)=>x.label===b[i].label&&x.points===b[i].points);
function detectScale(gs){for(const k of Object.keys(SCALES))for(const p of [true,false])if(sameGrades(gs,scaleGrades(k,p)))return {scale:k,pass:k==='none'?false:p};return {scale:'custom',pass:false}}

function sampleCourse(){
  const names=[['青木 遥','あおき はるか'],['石田 蒼','いしだ あおい'],['上野 美咲','うえの みさき'],['岡本 大輝','おかもと だいき'],['加藤 結衣','かとう ゆい'],['木村 陸','きむら りく'],['小林 葵','こばやし あおい'],['佐々木 悠真','ささき ゆうま']];
  return {id:uid(),name:'サンプル講義（例の名簿）',students:names.map(([n,k],i)=>({id:uid(),sid:'EX'+String(i+1).padStart(4,'0'),name:n,kana:k})),records:[]};
}
const DEFAULT_OPTS={scale:'4',pass:true,skipCalled:true,mode:'all',anim:true,promptOnStop:true,remindDays:3,autoEnc:false};
function fresh(){const c=sampleCourse();return {v:1,courses:[c],cur:c.id,grades:DEFAULT_GRADES.map(g=>({...g})),opts:{...DEFAULT_OPTS}}}

let S, storeOK=true;
function load(){
  try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):fresh()}catch(e){S=fresh();storeOK=false}
  if(!Array.isArray(S.courses))S=fresh();
  if(!S.courses.length){const c={id:uid(),name:'新しい講義',students:[],records:[]};S.courses.push(c);S.cur=c.id}
  if(!Array.isArray(S.grades)||!S.grades.length)S.grades=DEFAULT_GRADES.map(g=>({...g}));
  if(!S.opts||!S.opts.scale)S.opts=Object.assign({},S.opts||{},detectScale(S.grades));
  S.opts=Object.assign({...DEFAULT_OPTS},S.opts||{});
  ensureShape();
}
let snapT;
function save(o){
  const silent=!!(o&&o.silent);
  if(!silent)S.changedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true}catch(e){storeOK=false}
  $('#storeWarn').hidden=storeOK;
  clearTimeout(snapT);snapT=setTimeout(()=>snapshot('day'),3000);
  if(!silent)scheduleAuto();
  updateStatusBar();
}
const C=()=>S.courses.find(c=>c.id===S.cur)||S.courses[0];

const ui={tab:'call',phase:'idle',pick:null,editRec:null,lastRec:null,ignoreCalled:false,animating:false,recDate:'all',recView:'list',draft:null,mode:'replace'};

/* ---------- toast / modal ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function openModal(html,mount){const card=$('#modalCard');card.innerHTML=html;$('#modal').hidden=false;card.querySelectorAll('[data-m="close"]').forEach(b=>b.onclick=closeModal);if(mount)mount(card);const f=card.querySelector('input,select,textarea,button');if(f)f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modalCard').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function armButton(btn,armedText,fn){btn.addEventListener('click',()=>{if(btn.classList.contains('armed')){fn()}else{btn.classList.add('armed');btn.dataset.orig=btn.textContent;btn.textContent=armedText;setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=btn.dataset.orig}},4000)}})}
function confirmModal(title,body,okText,fn){
  openModal(`<h3>${esc(title)}</h3><p class="muted">${body}</p><div class="row"><button class="btn danger armed" id="mOk">${esc(okText)}</button><button class="btn" data-m="close">やめる</button></div>`,card=>{card.querySelector('#mOk').onclick=()=>{closeModal();fn()}});
}

/* ---------- CSV ---------- */
const csvCell=v=>{v=v==null?'':String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseTable(text){
  text=text.replace(/^﻿/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const first=lines[0]||'';
  const d=first.includes('\t')?'\t':(first.includes(',')?',':null);
  if(!d){
    // 「12345678 山口 太郎」のような空白区切りにも対応
    return lines.map(l=>{l=l.trim();const m=l.match(/^([A-Za-z]{0,3}\d{4,}[A-Za-z]?)\s+(.+)$/);return m?[m[1],m[2]]:[l]});
  }
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
const SIDRE=/^[A-Za-z]{0,3}\d{4,}[A-Za-z]?$/;
const GRADERE=/^([1-6]|[1-6]年[次生]?|[BMDbmd][1-6]|学部[1-6]年?[次生]?|修士[1-2]年?[次生]?|博士[1-3]年?[次生]?)$/;
/* 学年：数字だけなら「2年」と表示。入力がなければ何も出さない */
const fmtGrade=g=>{g=String(g??'').trim();return /^[1-6]$/.test(g)?g+'年':g};
const anyGrade=list=>list.some(x=>x&&String(x.grade??'').trim());
const sidLine=s=>esc(s.sid)+(fmtGrade(s.grade)?`<span class="grade">${esc(fmtGrade(s.grade))}</span>`:'');
function guessCols(rows){
  const head=rows[0]||[];
  const ncol=Math.max(1,...rows.map(r=>r.length));
  const isHead=rows.length>1&&head.some(h=>/学籍|番号|氏名|名前|学生|ID|name|^No/i.test(h))&&!head.some(h=>SIDRE.test(h));
  const body=isHead?rows.slice(1):rows;
  let sidCol=-1,nameCol=-1,kanaCol=-1,gradeCol=-1;
  const KANAH=/カナ|かな|フリガナ|ふりがな|kana|ヨミ|よみ/i;
  if(isHead){
    sidCol=head.findIndex(h=>/学籍|学生番号|学生ID|student.?(id|no)/i.test(h));
    if(sidCol<0)sidCol=head.findIndex(h=>/番号|^ID$|^No/i.test(h));
    nameCol=head.findIndex(h=>/氏名|名前|^name$|full.?name/i.test(h)&&!KANAH.test(h)&&!/ローマ|英/.test(h));
    kanaCol=head.findIndex(h=>KANAH.test(h)&&!/ローマ|英/.test(h));
    gradeCol=head.findIndex(h=>/学年|年次|^grade$|^year$/i.test(h));
  }
  const share=(j,test)=>{const v=body.map(r=>r[j]||'').filter(Boolean);return v.length?v.filter(test).length/v.length:0};
  const isKana=x=>/^[぀-ゟ゠-ヿｦ-ﾟ\s　・ー]+$/.test(x);
  if(sidCol<0){for(let j=0;j<ncol;j++){if(j===gradeCol)continue;if(share(j,x=>SIDRE.test(x))>.8){sidCol=j;break}}}
  if(gradeCol<0){for(let j=0;j<ncol;j++){if(j===sidCol)continue;if(share(j,x=>GRADERE.test(x))>.9){gradeCol=j;break}}}
  if(nameCol<0){for(let j=0;j<ncol;j++){if(j===sidCol||j===kanaCol||j===gradeCol)continue;if(share(j,x=>!/^\d+$/.test(x)&&!isKana(x)&&!GRADERE.test(x))>.8){nameCol=j;break}}}
  if(nameCol<0){for(let j=0;j<ncol;j++){if(j===sidCol||j===kanaCol||j===gradeCol)continue;if(share(j,x=>!/^\d+$/.test(x)&&!GRADERE.test(x))>.8){nameCol=j;break}}}
  if(kanaCol<0){for(let j=0;j<ncol;j++){if(j===sidCol||j===nameCol||j===gradeCol)continue;if(share(j,isKana)>.8){kanaCol=j;break}}}
  return {rows,isHead,sidCol,nameCol,kanaCol,gradeCol,ncol};
}
function draftList(d){
  const body=d.isHead?d.rows.slice(1):d.rows;
  const g=j=>r=>j>=0?(r[j]||''):'';
  return body.map(r=>({sid:g(d.sidCol)(r),name:g(d.nameCol)(r),kana:g(d.kanaCol)(r),grade:g(d.gradeCol)(r)}))
    .filter(x=>x.sid||x.name).map(x=>({sid:x.sid,name:x.name||x.sid,kana:x.kana,grade:x.grade}));
}
async function readFileText(f){
  const buf=await f.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}
  catch(e){try{return new TextDecoder('shift_jis').decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
}
function download(name,text,mime){

    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);toast(name+' を保存しました');

}

const stamp=()=>{const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())};
const safeName=s=>s.replace(/[\\/:*?"<>|\s]+/g,'_');

/* ---------- picking logic ---------- */
/* 記録の種類：指名（評価）／欠席／遅刻。欠席・遅刻は「出欠」の記録 */
const isCall=r=>!r.absent&&!r.late;
const isAtt=r=>!!(r.absent||r.late);
function attOn(c,stuId,day){
  const rs=c.records.filter(r=>r.stu===stuId&&isAtt(r)&&dayKey(r.ts)===day);
  return rs.length?rs.reduce((a,b)=>a.ts>b.ts?a:b):null;
}
function absentOn(c,day){const m=new Map();c.records.filter(r=>isAtt(r)&&dayKey(r.ts)===day).sort((a,b)=>a.ts.localeCompare(b.ts)).forEach(r=>m.set(r.stu,r.absent));return new Set([...m].filter(([,a])=>a).map(([k])=>k))}
function calledOn(c,day){return new Set(c.records.filter(r=>isCall(r)&&dayKey(r.ts)===day).map(r=>r.stu))}
function todayDone(c){const t=today();const a=absentOn(c,t);calledOn(c,t).forEach(x=>a.add(x));return a}
function callCounts(c){const m=new Map();c.records.forEach(r=>{if(isCall(r))m.set(r.stu,(m.get(r.stu)||0)+1)});return m}
function setAtt(c,s,day,status){
  const removed=c.records.filter(r=>r.stu===s.id&&isAtt(r)&&dayKey(r.ts)===day);
  c.records=c.records.filter(r=>!removed.includes(r));removed.forEach(r=>tombRec(c,r.id));
  if(status){
    const [y,m,d]=day.split('-').map(Number);
    const isToday=day===today();
    const ts=isToday?new Date():new Date(y,m-1,d,0,0,0);
    const wasCalledAbsent=removed.some(r=>r.absent&&!r.src);
    c.records.push({id:uid(),ts:ts.toISOString(),stu:s.id,sid:s.sid,name:s.name,kana:s.kana||'',grade:s.grade||'',label:status==='absent'?'欠席':'遅刻',points:null,absent:status==='absent',late:status==='late',memo:status==='late'&&wasCalledAbsent?'指名時は不在':'',src:'roster',pre:!isToday,updated:nowISO()});
  }
  save();
}
function eligible(c){
  const t=today();
  const abs=absentOn(c,t);
  let base=c.students.filter(s=>!abs.has(s.id)); // 今日欠席の人は、どの設定でも選ばない
  if(S.opts.skipCalled&&!ui.ignoreCalled){const done=calledOn(c,t);base=base.filter(s=>!done.has(s.id))}
  if(S.opts.mode==='least'&&base.length){
    const m=callCounts(c);const min=Math.min(...base.map(s=>m.get(s.id)||0));
    base=base.filter(s=>(m.get(s.id)||0)===min);base.minCount=min;
  }
  return base;
}
function notYetToday(c){const done=todayDone(c);return c.students.filter(s=>!done.has(s.id)).length}
let spinT;
function pick(all){
  if(ui.animating)return;
  const c=C();if(all)ui.ignoreCalled=true;
  const pool=eligible(c);
  if(!pool.length){ui.phase='idle';render();return}
  let cand=pool;if(pool.length>1&&ui.pick)cand=pool.filter(s=>s.id!==ui.pick);
  const s=cand[Math.floor(rand()*cand.length)];
  ui.pick=s.id;ui.editRec=null;ui.phase='called';
  if(!S.opts.anim||reduceMotion||c.students.length<2){render();return}
  ui.animating=true;render();
  const nameEl=$('#nameEl'),sidEl=$('#sidEl'),kanaEl=$('#kanaEl');let n=0;
  clearInterval(spinT);
  spinT=setInterval(()=>{
    const r=c.students[Math.floor(rand()*c.students.length)];
    if(nameEl){nameEl.textContent=r.name}if(sidEl){sidEl.innerHTML=sidLine(r)}if(kanaEl){kanaEl.textContent=r.kana||''}
    if(++n>=11){clearInterval(spinT);ui.animating=false;render()}
  },55);
}
function record(i){
  if(ui.animating)return;
  const c=C();
  const absent=i==='absent';
  const g=absent?{label:'欠席',points:null}:S.grades[i];
  if(!g)return;
  const memo=(($('#memo')||{}).value||'').trim();
  if(ui.editRec){
    const r=c.records.find(r=>r.id===ui.editRec);
    if(r)Object.assign(r,{label:g.label,points:g.points,absent,late:false,memo,edited:new Date().toISOString(),updated:nowISO()});
    ui.lastRec=ui.editRec;
  }else{
    const s=c.students.find(x=>x.id===ui.pick);if(!s)return;
    const r={id:uid(),ts:new Date().toISOString(),stu:s.id,sid:s.sid,name:s.name,kana:s.kana||'',grade:s.grade||'',label:g.label,points:g.points,absent,memo,updated:nowISO()};
    c.records.push(r);ui.lastRec=r.id;
  }
  ui.editRec=null;ui.phase='confirm';save();render();
}
function stats(c,stuId){
  const rs=c.records.filter(r=>r.stu===stuId);
  const calls=rs.filter(isCall);
  return {n:calls.length,abs:rs.filter(r=>r.absent).length,late:rs.filter(r=>r.late).length,last:calls[calls.length-1]};
}

    const r=C().records.find(r=>r.id===ui.editRec);const mm=$('#memo');if(r&&mm)mm.value=r.memo||'';
  }

function viewCall(){
  const c=C();const total=c.students.length;
  if(!total)return `<div class="stage"><p class="eyebrow">${esc(c.name)}</p><p>この講義にはまだ履修者が登録されていません。</p><button class="btn primary" data-a="goRoster">名簿を登録する</button></div>`;
  const t=today();const todays=c.records.filter(r=>dayKey(r.ts)===t);
  const nAbs=absentOn(c,t).size,nLate=todays.filter(r=>r.late).length;
  const todayLine=`今日の指名 ${todays.filter(isCall).length}件${nAbs?` ・ 欠席 ${nAbs}名`:''}${nLate?` ・ 遅刻 ${nLate}名`:''}`;
  if(ui.phase==='idle'){
    const pool=eligible(c).length;
    if(!pool){
      const present=c.students.filter(s=>!absentOn(c,t).has(s.id)).length;
      if(!present)return `<div class="stage"><p class="eyebrow">${esc(c.name)}</p><div class="notice"><b>今日は全員が欠席として登録されています。</b><br><span class="small muted">「名簿」タブで欠席を解除できます。</span></div></div>`;
      return `<div class="stage"><p class="eyebrow">${esc(c.name)}</p>
      <div class="notice"><b>今日は出席者全員を指名しました。</b><br><span class="small muted">もう一巡させることもできます（欠席者は選ばれません）。</span></div>
      <button class="btn primary" data-a="pickAll">出席者全員から選ぶ</button><p class="hist">${todayLine}</p></div>`;
    }
    const pl=eligible(c);
    const why=S.opts.mode==='least'?`（指名回数がいちばん少ない ${pl.minCount}回の人${S.opts.skipCalled&&!ui.ignoreCalled?'・今日未指名':''}・欠席者を除く）`:(S.opts.skipCalled&&!ui.ignoreCalled?'（今日まだ指名していない人・欠席者を除く）':'（欠席者を除く全員）');
    return `<div class="stage"><p class="eyebrow">${esc(c.name)}</p>
      <div class="poolnum"><b>${pool}</b><span class="muted">／ ${total}名 が対象</span></div><p class="hist">${why}</p>
      <button class="btn big primary" data-a="pick">指名する</button>
      <p class="hist">${todayLine} ・ Macではスペースキーでも指名できます</p></div>`;
  }
  if(ui.phase==='called'){
    const r=ui.editRec?c.records.find(r=>r.id===ui.editRec):null;
    const s=c.students.find(x=>x.id===ui.pick)||(r?{id:r.stu,sid:r.sid,name:r.name,kana:r.kana,grade:r.grade}:null);
    if(!s){ui.phase='idle';return viewCall()}
    const st=stats(c,s.id);const dis=ui.animating?' disabled':'';
    const lateNow=!ui.animating&&attOn(c,s.id,today());
    const hist=ui.animating?'&nbsp;':`${lateNow&&lateNow.late?`<b>今日 ${timeStr(lateNow.ts).slice(0,5)} 遅刻</b> ・ `:''}これまで：指名 ${st.n}回 ・ 欠席 ${st.abs}回${st.late?` ・ 遅刻 ${st.late}回`:''}${st.last?` ・ 前回 ${dayLabel(dayKey(st.last.ts))} ${esc(st.last.label)}`:''}`;
    return `<div class="stage">
      ${r?`<span class="editing">${dayLabel(dayKey(r.ts))} ${timeStr(r.ts).slice(0,5)} の記録を修正中</span>`:`<p class="eyebrow">${esc(c.name)}</p>`}
      <p class="sid" id="sidEl">${sidLine(s)}</p>
      <div class="namebox"><p class="kana" id="kanaEl">${esc(s.kana||'')}</p>
      <h2 class="name${ui.animating?' spin':''}" id="nameEl" aria-live="polite">${esc(s.name)}</h2></div>
      <p class="hist">${hist}</p>
      ${S.opts.scale==='none'?`<div class="grades one"><button class="gbtn" data-a="grade" data-i="0"${dis}><span class="gl">記録する</span><span class="gp">評価なし <kbd>1</kbd> <kbd>Space</kbd></span></button></div>`:`<div class="grades">${S.grades.map((g,i)=>`<button class="gbtn${r&&!r.absent&&r.label===g.label?' current':''}" data-a="grade" data-i="${i}"${dis}><span class="gl">${esc(g.label)}</span><span class="gp">${g.points==null?'点数なし':g.points+'点'}${i<9?` <kbd>${i+1}</kbd>`:''}</span></button>`).join('')}</div>`}
      <button class="abtn${r&&r.absent?' current':''}" data-a="absent"${dis}>欠席 <kbd>A</kbd></button>
      <label class="memo">メモ（任意・評価ボタンの前に入力）<input type="text" id="memo" autocomplete="off"></label>
      <div class="row">${r
        ?`<button class="btn" data-a="cancelEdit">修正をやめる</button><button class="btn danger" data-a="delRec">この記録を取り消す</button>`
        :`<button class="btn" data-a="repick"${dis}>別の学生にする</button><button class="link" data-a="stop">中断</button>`}</div>
    </div>`;
  }
  // confirm
  const r=c.records.find(r=>r.id===ui.lastRec);
  if(!r){ui.phase='idle';return viewCall()}
  const remain=notYetToday(c);
  const long=[...r.label].length>1;
  const cur=c.students.find(x=>x.id===r.stu)||{};
  const kana=r.kana||cur.kana||'';
  const grade=cur.grade||r.grade||'';
  return `<div class="stage">
    <div class="seal${r.absent?' absent':''}${long&&!r.absent?' long':''}">${esc(r.label)}</div>

    ${r.memo?`<p class="notice small">${esc(r.memo)}</p>`:''}
    <div class="row"><button class="btn" data-a="edit">修正</button><button class="btn primary" data-a="next">次を指名 <kbd>Space</kbd></button></div>
    <p class="hist">${remain?`今日まだ指名していない人 ${remain}名`:'今日は全員を指名しました'} ・ ${todayLine}</p>
    <button class="link" data-a="stop">指名を終える</button>
  </div>`;
}
const recDay=()=>ui.recDate==='today'?today():ui.recDate;

function filteredRecs(c){return ui.recDate==='all'?c.records.slice():c.records.filter(r=>dayKey(r.ts)===recDay())}
function summarize(c,recs){

function editRowModal(id){
  const c=C();const r=c.records.find(x=>x.id===id);if(!r)return;
  const opts=S.grades.map((g,i)=>`<option value="${i}"${isCall(r)&&g.label===r.label?' selected':''}>${esc(g.label)}${g.points!=null?`（${g.points}点）`:''}</option>`).join('')
    +(isCall(r)&&!S.grades.some(g=>g.label===r.label)?`<option value="keep" selected>${esc(r.label)}（現在の値）</option>`:'')
    +`<option value="absent"${r.absent?' selected':''}>欠席</option><option value="late"${r.late?' selected':''}>遅刻</option>`;
  openModal(`<h3>${esc(r.name)} <span class="muted small">${esc(r.sid)}</span></h3>
    <p class="muted small">${dayLabel(dayKey(r.ts))} ${timeStr(r.ts)} の記録</p>
    <label class="field">評価<select id="eG">${opts}</select></label>
    <label class="field">メモ<input type="text" id="eM" value="${esc(r.memo)}"></label>
    <div class="row"><button class="btn primary" id="eSave">保存</button><button class="btn" data-m="close">閉じる</button><button class="btn danger" id="eDel" style="margin-left:auto">削除</button></div>`,card=>{
    card.querySelector('#eSave').onclick=()=>{
      const v=card.querySelector('#eG').value;
      if(v==='absent')Object.assign(r,{label:'欠席',points:null,absent:true,late:false});
      else if(v==='late')Object.assign(r,{label:'遅刻',points:null,absent:false,late:true});
      else if(v!=='keep'){const g=S.grades[+v];Object.assign(r,{label:g.label,points:g.points,absent:false,late:false})}
      r.memo=card.querySelector('#eM').value.trim();r.edited=new Date().toISOString();r.updated=r.edited;
      save();closeModal();render();toast('修正しました');
    };
    armButton(card.querySelector('#eDel'),'もう一度押すと削除',()=>{c.records=c.records.filter(x=>x.id!==id);tombRec(c,id);save();closeModal();render();toast('記録を削除しました')});
  });
}

      const rows=[['日付','時刻','学籍番号',...(cg?['学年']:[]),'氏名','ふりがな','種類','評価','点数','欠席','遅刻','メモ','修正日時']].concat(recs.map(r=>[dayKey(r.ts),r.pre?'事前登録':timeStr(r.ts),r.sid,...(cg?[gOf(r)]:[]),r.name,r.kana||kmap.get(r.stu)||'',r.absent?'欠席':r.late?'遅刻':'指名',isCall(r)?r.label:'',r.points??'',r.absent?'1':'',r.late?'1':'',r.memo||'',r.edited?dayKey(r.edited)+' '+timeStr(r.edited):'']));

      exportModal(`学生別集計CSV（${recRangeLabel()}）`,`${safeName(c.name)}_集計_${ui.recDate==='all'?'全期間_'+stamp():recDay().replace(/-/g,'')}.csv`,toCSV(rows),true,toCSV(settingsRows(c,recRangeLabel())));break}

const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const ITER=310000;
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptText(text,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass,salt,ITER);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));
  return JSON.stringify({format:'shimeicho-encrypted',v:1,kdf:'PBKDF2-SHA256',iter:ITER,cipher:'AES-256-GCM',created:new Date().toISOString(),salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function decryptText(obj,pass){
  const key=await deriveKey(pass,unb64(obj.salt),obj.iter||ITER);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));
  return new TextDecoder().decode(pt);
}
const canCrypto=()=>!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false);

/* ---------- 保護：削除の記録（墓石）・統合 ---------- */
const nowISO=()=>new Date().toISOString();
function tombRec(c,id){(c.tombs=c.tombs||{})[id]=nowISO()}
function tombStu(c,id){(c.stuTombs=c.stuTombs||{})[id]=nowISO()}
const upd=r=>r.updated||r.edited||r.ts;
const maxMerge=(a,b)=>{const o={...(a||{})};for(const k in (b||{}))if(!o[k]||b[k]>o[k])o[k]=b[k];return o};
function ensureShape(){
  const cutoff=new Date(Date.now()-400*864e5).toISOString();
  const prune=o=>{o=o||{};for(const k in o)if(o[k]<cutoff)delete o[k];return o};
  S.courseTombs=prune(S.courseTombs);
  S.courses.forEach(c=>{c.students=c.students||[];c.records=c.records||[];c.tombs=prune(c.tombs);c.stuTombs=prune(c.stuTombs)});
}
function mergeState(local,inc){
  const L=JSON.parse(JSON.stringify(local)),I=JSON.parse(JSON.stringify(inc));
  const rep={added:0,updated:0,removed:0,dedup:0,courses:0,students:0};
  L.courseTombs=maxMerge(L.courseTombs,I.courseTombs);
  for(const ic of (I.courses||[])){
    ic.records=ic.records||[];ic.students=ic.students||[];
    if(L.courseTombs[ic.id])continue;
    const lc=L.courses.find(c=>c.id===ic.id)||L.courses.find(c=>c.name===ic.name);
    if(!lc){L.courses.push(ic);rep.courses++;rep.added+=ic.records.length;continue}
    mergeCourse(lc,ic,rep);
  }
  L.courses=L.courses.filter(c=>!L.courseTombs[c.id]);
  return {state:L,rep};
}
function mergeCourse(lc,ic,rep){
  lc.records=lc.records||[];lc.students=lc.students||[];
  lc.tombs=maxMerge(lc.tombs,ic.tombs);lc.stuTombs=maxMerge(lc.stuTombs,ic.stuTombs);
  // 学生：ID → 学籍番号 → 氏名 の順で同じ人を探す
  const idMap=new Map();
  for(const is of ic.students){
    const ls=lc.students.find(s=>s.id===is.id)||(is.sid?lc.students.find(s=>s.sid===is.sid):lc.students.find(s=>!s.sid&&s.name===is.name));
    if(ls){idMap.set(is.id,ls.id);if(!ls.kana&&is.kana)ls.kana=is.kana;if(!ls.grade&&is.grade)ls.grade=is.grade}
    else{idMap.set(is.id,is.id);if(!lc.stuTombs[is.id]){lc.students.push(is);rep.students++}}
  }
  lc.students=lc.students.filter(s=>!lc.stuTombs[s.id]);
  // 記録：IDごとに新しい方を残す
  const byId=new Map(lc.records.map(r=>[r.id,r]));
  for(const r0 of ic.records){
    const r={...r0,stu:idMap.get(r0.stu)||r0.stu};const lr=byId.get(r.id);
    if(!lr){byId.set(r.id,r);rep.added++}
    else if(upd(r)>upd(lr)){byId.set(r.id,r);rep.updated++}
  }
  let recs=[...byId.values()];const before=recs.length;
  recs=recs.filter(r=>!(lc.tombs[r.id]&&lc.tombs[r.id]>=upd(r)));rep.removed+=before-recs.length;
  // 出欠：同じ学生・同じ日は1件だけ（後から操作した方を残す）
  const att=new Map(),out=[];
  for(const r of recs){
    if(!isAtt(r)){out.push(r);continue}
    const k=r.stu+'|'+dayKey(r.ts);const o=att.get(k);
    if(!o)att.set(k,r);
    else{rep.dedup++;const keep=upd(r)>upd(o)?r:o;const drop=keep===r?o:r;lc.tombs[drop.id]=nowISO();att.set(k,keep)}
  }
  lc.records=out.concat([...att.values()]).sort((a,b)=>a.ts.localeCompare(b.ts));
}

/* ---------- IndexedDB：自動スナップショット・自動保存先 ---------- */
let dbP=null;
function db(){
  if(!dbP)dbP=new Promise((res,rej)=>{try{
    const q=indexedDB.open('shimeicho',1);
    q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{keyPath:'key'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
  }catch(e){rej(e)}});
  return dbP;
}
function idb(store,mode,fn){return db().then(d=>new Promise((res,rej)=>{const tx=d.transaction(store,mode);const q=fn(tx.objectStore(store));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)}))}
const idbGet=(s,k)=>idb(s,'readonly',st=>st.get(k)).catch(()=>undefined);
const idbPut=(s,v,k)=>idb(s,'readwrite',st=>k===undefined?st.put(v):st.put(v,k)).catch(()=>{});
const idbDel=(s,k)=>idb(s,'readwrite',st=>st.delete(k)).catch(()=>{});
const idbAll=s=>idb(s,'readonly',st=>st.getAll()).catch(()=>[]);
async function snapshot(kind,label){
  try{
    const at=nowISO();const key=kind==='day'?'day:'+today():'evt:'+at;
    await idbPut('snaps',{key,kind,label:label||'',at,courses:S.courses.length,records:S.courses.reduce((a,c)=>a+c.records.length,0),data:JSON.stringify(S)});
    const all=(await idbAll('snaps'))||[];
    const old=all.filter(x=>x.kind==='day').sort((a,b)=>b.key.localeCompare(a.key)).slice(14)
      .concat(all.filter(x=>x.kind!=='day').sort((a,b)=>b.at.localeCompare(a.at)).slice(10));
    for(const x of old)await idbDel('snaps',x.key);
  }catch(e){}
}
async function snapsModal(){
  const all=((await idbAll('snaps'))||[]).sort((a,b)=>b.at.localeCompare(a.at));
  openModal(`<h3>自動スナップショット</h3>
    <p class="small muted">このブラウザの中に、日ごとの最終状態（14日分）と、削除・取り込みなどの直前の状態（10件）を自動で残しています。ブラウザのデータを消すと、これも一緒に消えます。</p>
    ${all.length?`<div class="tbl-wrap"><table><thead><tr><th>日時</th><th>内容</th><th class="num">記録</th><th></th></tr></thead><tbody>${all.map(x=>`<tr><td>${dayLabel(dayKey(x.at))} ${timeStr(x.at).slice(0,5)}</td><td>${x.kind==='day'?'その日の最終状態':esc(x.label)}</td><td class="num">${x.records}</td><td><button class="btn small" data-k="${esc(x.key)}">この状態に戻す</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">まだありません。記録を付けると自動で作られます。</p>'}
    <div class="row"><button class="btn" data-m="close">閉じる</button></div>`,card=>{
    card.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      const x=all.find(y=>y.key===b.dataset.k);if(!x)return;closeModal();
      confirmModal('この状態に戻しますか',`${dayLabel(dayKey(x.at))} ${timeStr(x.at).slice(0,5)} の状態（記録 ${x.records}件）に戻します。今の状態も念のためスナップショットに残します。`,'戻す',async()=>{
        await snapshot('evt','戻す前');S=JSON.parse(x.data);normalizeAfterRestore();save();resetUi();render();toast('戻しました');
      });
    });
  });
}

/* ---------- 自動保存（Chrome / Edge のファイル書き込み） ---------- */
const fsOK=typeof window.showSaveFilePicker==='function';
let fileHandle=null,autoPass=null,autoState='off',autoT=null,autoName='',autoSig=null;
async function initAutoSave(){
  if(!fsOK)return;
  fileHandle=await idbGet('kv','autoHandle');
  if(!fileHandle){autoState='off';updateStatusBar();return}
  autoName=fileHandle.name||'';
  let p='prompt';try{p=await fileHandle.queryPermission({mode:'readwrite'})}catch(e){}
  autoState=(p==='granted'&&!S.opts.autoEnc)?'ok':'needResume';
  updateStatusBar();renderAutoStatus();
  if(autoState==='ok')scheduleAuto();
}
function scheduleAuto(){if(autoState!=='ok'||!fileHandle)return;clearTimeout(autoT);autoT=setTimeout(()=>writeAuto(false),1500)}
async function writeAuto(force){
  if(!fileHandle)return;
  try{
    if(!force){
      if(autoSig===null)autoSig=(await idbGet('kv','autoSig'))||undefined;
      const f=await fileHandle.getFile();
      if(autoSig&&f.size>0&&(f.lastModified!==autoSig.m||f.size!==autoSig.s)){autoState='conflict';updateStatusBar();renderAutoStatus();return}
    }
    const text=S.opts.autoEnc?await encryptText(JSON.stringify(S),autoPass):JSON.stringify(S);
    const w=await fileHandle.createWritable();await w.write(text);await w.close();
    const f2=await fileHandle.getFile();autoSig={m:f2.lastModified,s:f2.size};idbPut('kv',autoSig,'autoSig');
    autoState='ok';S.lastBackup=nowISO();S.lastAuto=S.lastBackup;save({silent:true});
  }catch(e){autoState='error';updateStatusBar()}
  renderAutoStatus();
}
function autoStatusText(){
  if(!fileHandle)return '未設定';
  const last=S.lastAuto?`（最終 ${dayLabel(dayKey(S.lastAuto))} ${timeStr(S.lastAuto).slice(0,5)}）`:'';
  return ({ok:`「${esc(autoName)}」に自動保存中${S.opts.autoEnc?'・暗号化':''}${last}`,needResume:`停止中：再開の操作が必要です${last}`,error:`保存に失敗しました${last}`,conflict:'保存先のファイルが別の端末で更新されたため、上書きせずに止めています'})[autoState]||'未設定';
}
function renderAutoStatus(){const el=$('#autoStatus');if(el)el.innerHTML=autoStatusText()}
function autoSetupModal(){
  const cc=canCrypto();
  openModal(`<h3>自動保存の設定</h3>
    <p class="small muted">保存先のファイルを1つ選ぶと、記録が変わるたびにそのファイルへ自動で書き込みます。iCloud Drive か「Google ドライブ」のフォルダの中を選ぶと、そのままクラウドにも残ります。</p>
    ${cc?`<label class="check"><input type="checkbox" id="auEnc" checked>パスワードで暗号化する</label>
    <div id="auPw" class="stack" style="gap:8px">
      <label class="field">パスワード（8文字以上）<input type="password" id="auP1" autocomplete="new-password"></label>
      <label class="field">もう一度<input type="password" id="auP2" autocomplete="new-password"></label>
      <p class="small muted">ブラウザを開き直すたびに、このパスワードを1回入力します。忘れるとファイルを開けません。</p></div>`:''}
    <div class="row"><button class="btn primary" id="auGo">保存先ファイルを選ぶ</button><button class="btn" data-m="close">やめる</button></div>`,card=>{
    const enc=card.querySelector('#auEnc');
    if(enc)enc.onchange=()=>{card.querySelector('#auPw').hidden=!enc.checked};
    card.querySelector('#auGo').onclick=async()=>{
      const doEnc=!!(enc&&enc.checked);let pw=null;
      if(doEnc){
        const p1=card.querySelector('#auP1').value,p2=card.querySelector('#auP2').value;
        if(p1.length<8){toast('パスワードは8文字以上にしてください');return}
        if(p1!==p2){toast('2つのパスワードが一致しません');return}
        pw=p1;
      }
      let h;
      try{h=await window.showSaveFilePicker({suggestedName:'指名帳_自動保存.json',types:[{description:'指名帳のデータ',accept:{'application/json':['.json']}}]})}catch(e){return}
      fileHandle=h;autoName=h.name;await idbPut('kv',h,'autoHandle');
      S.opts.autoEnc=doEnc;autoPass=pw;autoState='ok';save({silent:true});
      closeModal();await writeAuto(true);toast('自動保存を始めました');updateStatusBar();if(ui.tab==='set')render();
    };
  });
}
function resumeModal(){
  if(!fileHandle){autoSetupModal();return}
  const needPw=!!S.opts.autoEnc;const conflict=autoState==='conflict';
  openModal(`<h3>${conflict?'自動保存先が更新されています':'自動保存を再開'}</h3>
    <p class="small muted">保存先：${esc(autoName)}</p>
    ${conflict?'<p class="small">別の端末（またはアプリ）がこのファイルを書き換えました。「統合して再開」を選ぶと、ファイルの内容と今のデータを合わせてから保存を続けます。</p>':''}
    ${needPw&&!autoPass?`<label class="field">自動保存のパスワード<input type="password" id="rsAP" autocomplete="current-password"></label>`:''}
    <p class="small" id="rsAErr" style="color:var(--seal)" hidden></p>
    <div class="row">${conflict?'<button class="btn primary" id="rsMerge">統合して再開</button><button class="btn danger" id="rsOver">上書きして再開</button>':'<button class="btn primary" id="rsAGo">再開する</button>'}
      <button class="btn" id="rsANew">保存先を選び直す</button><button class="btn" data-m="close">あとで</button></div>`,card=>{
    const err=m=>{const e=card.querySelector('#rsAErr');e.textContent=m;e.hidden=false};
    card.querySelector('#rsANew').onclick=()=>{closeModal();autoSetupModal()};
    const prepare=async()=>{
      let p;try{p=await fileHandle.requestPermission({mode:'readwrite'})}catch(e){p='denied'}
      if(p!=='granted'){err('ファイルへの書き込みが許可されませんでした。');return null}
      let pw=autoPass;const inp=card.querySelector('#rsAP');if(inp)pw=inp.value;
      let fileData=null;
      try{
        const txt=await (await fileHandle.getFile()).text();
        if(txt.trim()){let obj=JSON.parse(txt);if(obj.format==='shimeicho-encrypted'){obj=JSON.parse(await decryptText(obj,pw))}fileData=obj}
      }catch(e){if(needPw){err('パスワードが違うか、ファイルが壊れています。');return null}}
      if(needPw)autoPass=pw;
      return {fileData};
    };
    const go=card.querySelector('#rsAGo');
    if(go)go.onclick=async()=>{const r=await prepare();if(!r)return;closeModal();await writeAuto(false);
      if(autoState==='conflict'){resumeModal();return}toast('自動保存を再開しました');updateStatusBar()};
    const mg=card.querySelector('#rsMerge');
    if(mg)mg.onclick=async()=>{const r=await prepare();if(!r)return;closeModal();
      if(r.fileData&&Array.isArray(r.fileData.courses))await doMerge(r.fileData);
      await writeAuto(true);updateStatusBar();toast('統合して自動保存を再開しました')};
    const ov=card.querySelector('#rsOver');
    if(ov)armButton(ov,'もう一度押すと上書き',async()=>{const r=await prepare();if(!r)return;closeModal();await writeAuto(true);updateStatusBar();toast('上書きして再開しました')});
  });
}
async function autoOff(){
  await idbDel('kv','autoHandle');await idbDel('kv','autoSig');
  fileHandle=null;autoPass=null;autoState='off';autoSig=undefined;autoName='';S.opts.autoEnc=false;save({silent:true});render();toast('自動保存をやめました');
}

/* ---------- バックアップの知らせ ---------- */
const hasUnbacked=()=>!!S.changedAt&&(!S.lastBackup||S.changedAt>S.lastBackup);
const backupAge=()=>S.lastBackup?Math.floor((Date.now()-new Date(S.lastBackup).getTime())/864e5):Infinity;
function updateStatusBar(){
  const b=$('#statusBar');if(!b)return;let h='';
  if(autoState==='needResume')h=`<span>自動保存が止まっています（ブラウザを開き直したあとは再開の操作が必要です）</span><button class="btn small primary" data-s="resume">再開する</button>`;
  else if(autoState==='conflict')h=`<span>自動保存先のファイルが別の端末で更新されています</span><button class="btn small primary" data-s="resume">確認する</button>`;
  else if(autoState==='error')h=`<span>自動保存に失敗しました</span><button class="btn small primary" data-s="resume">再開する</button><button class="btn small" data-s="backup">手動でバックアップ</button>`;
  else if(autoState!=='ok'&&hasUnbacked()){
    const nrec=S.courses.reduce((a,c)=>a+c.records.length,0);
    if(S.lastBackup?backupAge()>=S.opts.remindDays:nrec>0)
      h=`<span>${S.lastBackup?`最後のバックアップから ${backupAge()}日たっています`:'まだバックアップがありません'}</span><button class="btn small primary" data-s="backup">今すぐバックアップ</button>`;
  }
  b.innerHTML=h?`<div class="wrap sbar-in">${h}</div>`:'';b.hidden=!h;
}
$('#statusBar').addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(!t)return;if(t.dataset.s==='resume')resumeModal();else backupModal()});

load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
updateStatusBar();
initAutoSave();
</script>
</body>
</html>
